[tool.poetry]
name = "pyeeg-toolbox"
version = "0.7.0"
description = "Toolbox to read, write, create montages, apply dsp transforms and conduct analysis of EEG signals"
authors = ["dlp <mossdet.detector@gmail.com>"]
readme = "README.md"
package-mode = true

[tool.poetry.dependencies]
python = "^3.12"
plotly = "^5.24.1"
numpy = "^2.1.1"
scikit-learn = "^1.5.2"
seaborn = "^0.13.2"
edflib-python = "^1.0.8"
edfio = "^0.4.4"
mne = "^1.8.0"
dash = "^2.18.1"
kaleido = "0.1.0"
pyqt6 = "^6.7.1"
statsmodels = "^0.14.4"
hotelling = "^0.5.0"
jupyterlab = "^4.3.1"
micromed-io = "^0.4.5"
pybv = "^0.7.6"
scikit-posthocs = "^0.11.4"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"


[tool.poetry.group.extras.dependencies]
sphinx = "^8.1.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"